name: Update Breaking News cache

on:
  schedule:
    - cron: '23 1,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: breaking-news-cache
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Crawl latest articles
        run: node tools/crawl-breaking-news.js --limit=10 --concurrency=4

      - name: Commit cache changes
        shell: bash
        run: |
          if git diff --quiet -- data/news-cache.json; then
            echo "No news changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news-cache.json
          git commit -m "chore: update Breaking News cache"
          git push