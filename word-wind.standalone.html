<style>
/* ============================================================
 * Word Wind · 自定义样式
 * Tailwind 负责排版与配色，这里只放 Tailwind 不方便表达的部分：
 * 动态渐变背景、毛玻璃、阅读排版、可点击单词、弹窗动画、滚动条
 * ============================================================ */

:root {
  --ww-cream-1: #fbf6ec;
  --ww-cream-2: #f3e8d6;
  --ww-ink: #35404e;
  --ww-blue: #4f8ef7;
  --ww-pink: #ec5f8b;
  --ww-violet: #8b7cf6;
  --ww-card: rgba(255, 255, 255, 0.92);
  --ww-line: #e8ddca;
  --ww-word-hover: rgba(79, 142, 247, 0.12);
  --ww-word-seen: rgba(236, 95, 139, 0.14);
}

.dark {
  --ww-cream-1: #1a1c24;
  --ww-cream-2: #22252f;
  --ww-ink: #e8ecf3;
  --ww-card: rgba(36, 40, 50, 0.92);
  --ww-line: #363c4a;
  --ww-word-hover: rgba(96, 165, 250, 0.18);
  --ww-word-seen: rgba(236, 95, 139, 0.22);
}

html, body { height: 100%; }

body {
  margin: 0;
  color: var(--ww-ink);
  background: linear-gradient(-45deg, #fbf6ec, #f0e3cc, #f7ecdd, #fbe8ef);
  background-size: 400% 400%;
  animation: wwShift 20s ease infinite;
  -webkit-font-smoothing: antialiased;
}

.dark body {
  background: linear-gradient(-45deg, #191b23, #22242e, #211d28, #191b23);
  background-size: 400% 400%;
}

@keyframes wwShift {
  0% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
  100% { background-position: 0% 50%; }
}

/* 顶部/底部栏毛玻璃 */
.ww-glass {
  background: rgba(255, 253, 248, 0.78);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.dark .ww-glass { background: rgba(28, 30, 38, 0.82); }

/* 卡片 */
.ww-card {
  background: var(--ww-card);
  border: 1px solid rgba(255, 255, 255, 0.7);
  box-shadow: 0 16px 40px rgba(120, 96, 60, 0.14);
}
.dark .ww-card {
  border-color: rgba(255, 255, 255, 0.06);
  box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
}

/* 弹窗卡片需要完全不透明，避免正文透过弹窗隐约可见 */
.ww-card.ww-solid { background: #fffdf9; }
.dark .ww-card.ww-solid { background: #242832; }

/* ---------------- 阅读页排版 ---------------- */
.article-body { font-family: Georgia, "Times New Roman", "Songti SC", serif; }

.article-para {
  font-size: 1.06rem;
  line-height: 2.05;
  margin: 0 0 1.15rem;
  color: #3c4756;
  text-align: justify;
  hyphens: auto;
}
.dark .article-para { color: #cfd8e4; }
.article-para:first-of-type::first-letter {
  font-size: 2.6rem;
  font-weight: 700;
  line-height: 1;
  padding-right: 6px;
  color: var(--ww-blue);
}
.article-para:last-child { margin-bottom: 0; }

.article-body.font-sm .article-para { font-size: 0.98rem; line-height: 1.95; }
.article-body.font-lg .article-para { font-size: 1.18rem; line-height: 2.15; }

/* 可点击单词 / 词组 */
.rd-word {
  cursor: pointer;
  border-radius: 5px;
  padding: 1px 2px;
  margin: 0 -1px;
  transition: background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
  box-shadow: inset 0 -2px 0 rgba(79, 142, 247, 0);
}
.rd-word:hover,
.rd-word:focus-visible {
  color: #2f6fd0;
  background: var(--ww-word-hover);
  box-shadow: inset 0 -2px 0 var(--ww-blue);
  outline: none;
}
.dark .rd-word:hover,
.dark .rd-word:focus-visible { color: #8fc0ff; }

.rd-word.is-seen {
  box-shadow: inset 0 -2px 0 rgba(236, 95, 139, 0.55);
}
.rd-word.is-seen:hover { box-shadow: inset 0 -2px 0 var(--ww-blue); }

.rd-phrase {
  cursor: pointer;
  border-radius: 6px;
  padding: 1px 5px;
  margin: 0 -2px;
  background: linear-gradient(90deg, rgba(220, 236, 251, 0.9), rgba(253, 227, 238, 0.9));
  box-shadow: inset 0 -1px 0 rgba(139, 124, 246, 0.35);
  transition: filter 0.16s ease, box-shadow 0.16s ease;
}
.rd-phrase:hover { filter: brightness(0.96); box-shadow: inset 0 -2px 0 var(--ww-violet); }
.dark .rd-phrase { background: linear-gradient(90deg, rgba(38, 52, 74, 0.95), rgba(58, 39, 51, 0.95)); }

/* ---------------- 弹窗动画 ---------------- */
.ww-fade-enter-active, .ww-fade-leave-active { transition: opacity 0.22s ease; }
.ww-fade-enter-from, .ww-fade-leave-to { opacity: 0; }

.ww-pop-enter-active { animation: wwPop 0.32s cubic-bezier(0.2, 1.2, 0.4, 1) both; }
.ww-pop-leave-active { transition: opacity 0.18s ease, transform 0.18s ease; }
.ww-pop-leave-to { opacity: 0; transform: scale(0.96) translateY(10px); }

@keyframes wwPop {
  from { opacity: 0; transform: scale(0.92) translateY(18px); }
  to { opacity: 1; transform: scale(1) translateY(0); }
}

/* ---------------- 表单校验失败抖动 ---------------- */
@keyframes wwShake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(3px); }
}
.ww-shake { animation: wwShake 0.45s ease; }

/* ---------------- 发音按钮 ---------------- */
.phon-btn.speaking {
  background: linear-gradient(135deg, var(--ww-violet), var(--ww-blue)) !important;
  box-shadow: 0 10px 22px rgba(139, 124, 246, 0.45) !important;
}

/* ---------------- 滚动条 ---------------- */
.ww-scroll::-webkit-scrollbar { width: 10px; }
.ww-scroll::-webkit-scrollbar-thumb {
  background: rgba(139, 152, 168, 0.45);
  border-radius: 99px;
  border: 3px solid transparent;
  background-clip: content-box;
}
.ww-scroll::-webkit-scrollbar-track { background: transparent; }

::selection { background: rgba(79, 142, 247, 0.22); }

[v-cloak] { display: none; }

</style>
</head>

<script>
/* ==== js/router.js ==== */
/* ============================================================
 * 极简 hash 路由（无需构建工具，file:// 直接打开也能工作）
 *   #/login   登录页
 *   #/app     背单词主页
 *   #/reading 英语文章阅读页
 * ============================================================ */
(function (global) {
  'use strict';

  const ROUTES = { login: '#/login', app: '#/app', reading: '#/reading' };
  const ALIAS = { '': 'login', '#': 'login', '#/': 'login', '#/index': 'login' };

  function parse(hash) {
    const h = String(hash || '').trim();
    if (ALIAS[h] !== undefined) return ALIAS[h];
    if (h === ROUTES.app) return 'app';
    if (h === ROUTES.reading) return 'reading';
    if (h === ROUTES.login) return 'login';
    return 'login';
  }

  function current() { return parse(global.location.hash); }

  function navigate(route) {
    const target = ROUTES[route] || ROUTES.login;
    // 先直接切视图，保证不依赖 hashchange：
    // 某些预览沙箱 / file:// 环境下改写 location.hash 可能被拦截或不触发事件
    const store = global.WW && global.WW.store;
    if (store && store.state) store.state.route = route;
    try {
      if (global.location.hash !== target) global.location.hash = target;
    } catch (e) { /* 沙箱禁止改 hash 时忽略，视图已经切过去了 */ }
  }

  function start(onChange) {
    const handler = () => onChange(current());
    global.addEventListener('hashchange', handler);
    if (!global.location.hash) {
      try { global.history.replaceState(null, '', ROUTES.login); } catch (e) { global.location.hash = ROUTES.login; }
    }
    onChange(current());
  }

  global.WW = global.WW || {};
  global.WW.router = { ROUTES: ROUTES, parse: parse, current: current, navigate: navigate, start: start };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ==== js/store.js ==== */
/* ============================================================
 * 全局状态（Vue reactive store，组件通过 setup() 注入使用）
 * 负责：登录态 / 词库 / 收藏夹 / 生词本 / 主题 / 详情弹窗 / 查词 / 提示
 * 持久化：localStorage（ww_user / ww_unknown / ww_favorites / ww_theme）
 * ============================================================ */
(function (global) {
  'use strict';
  const Vue = global.Vue;
  const { reactive } = Vue;

  const LS = { user: 'ww_user', unknown: 'ww_unknown', fav: 'ww_favorites', theme: 'ww_theme' };
  const READING_LIB = 'reading';

  function readArray(key) {
    try {
      const v = JSON.parse(localStorage.getItem(key) || '[]');
      return Array.isArray(v) ? v : [];
    } catch (e) { return []; }
  }

  const state = reactive({
    route: 'login',
    user: '',
    lib: 'cet4',
    index: 0,
    hideMeaning: false,
    unknown: [],
    favorites: [],
    theme: 'light',
    detail: null,          // { entry, lib, word, missing }
    toastText: '',
    toastShow: false,
    lookedUp: [],          // 阅读页已查过的词（用于轻量高亮）
    readingFont: 'md',     // sm | md | lg
    readingArticle: global.WW.ARTICLE,
    readingLevel: 3,
    readingNewsItems: [],
    readingSource: 'fallback'
  });

  const keyOf = (lib, word) => lib + '::' + word;

  /* ---------------- 主题 ---------------- */
  function applyTheme(dark) {
    state.theme = dark ? 'dark' : 'light';
    document.documentElement.classList.toggle('dark', dark);
    try { localStorage.setItem(LS.theme, state.theme); } catch (e) {}
  }
  function toggleTheme() { applyTheme(state.theme !== 'dark'); }

  /* ---------------- 词库 ---------------- */
  function libLabel(key) {
    if (key === READING_LIB) return '文章生词';
    const L = global.WW.LIBRARIES[key];
    return L ? L.label : key;
  }
  function libs() { return global.WW.LIBRARIES; }
  function words() { return (libs()[state.lib] || { words: [] }).words; }
  function current() { const w = words(); return w[state.index] || w[0] || null; }
  function setLib(key) { state.lib = key; state.index = 0; state.hideMeaning = false; }
  function go(delta) {
    const n = words().length;
    state.index = Math.min(Math.max(state.index + delta, 0), n - 1);
  }
  function jumpTo(oneBased) {
    const n = words().length;
    const v = parseInt(oneBased, 10);
    if (isNaN(v) || v < 1 || v > n) { toast('请输入 1 - ' + n + ' 之间的序号'); return false; }
    state.index = v - 1;
    return true;
  }
  function toggleHide() { state.hideMeaning = !state.hideMeaning; }

  /* ---------------- 查词（词库 + 阅读词典通用） ---------------- */
  function findWord(lib, word) {
    if (lib === READING_LIB) {
      const d = global.WW.READING_DICT;
      return d[word] || global.WW.readingUtils.lookupWord(d, word) || null;
    }
    const L = libs()[lib];
    return L ? (L.words.find((x) => x.word === word) || null) : null;
  }

  /* ---------------- 收藏夹 / 生词本 ---------------- */
  function saveUnknown() { try { localStorage.setItem(LS.unknown, JSON.stringify(state.unknown)); } catch (e) {} }
  function saveFav() { try { localStorage.setItem(LS.fav, JSON.stringify(state.favorites)); } catch (e) {} }

  function isUnknown(lib, word) { return state.unknown.indexOf(keyOf(lib, word)) > -1; }
  function isFav(lib, word) { return state.favorites.indexOf(keyOf(lib, word)) > -1; }

  function addUnknown(lib, word) {
    const k = keyOf(lib, word);
    if (state.unknown.indexOf(k) < 0) { state.unknown.push(k); saveUnknown(); return true; }
    return false;
  }
  function removeKey(list, key) {
    const i = state[list].indexOf(key);
    if (i > -1) state[list].splice(i, 1);
  }
  function removeUnknown(key) { removeKey('unknown', key); saveUnknown(); }
  function clearUnknown() { state.unknown.splice(0); saveUnknown(); }
  function removeFav(key) { removeKey('favorites', key); saveFav(); }
  function clearFav() { state.favorites.splice(0); saveFav(); }
  function toggleFav(lib, word) {
    const k = keyOf(lib, word);
    const i = state.favorites.indexOf(k);
    if (i > -1) state.favorites.splice(i, 1); else state.favorites.push(k);
    saveFav();
    return i < 0;
  }
  function collect(listName) {
    const out = [];
    state[listName].forEach((key) => {
      const p = key.split('::');
      const w = findWord(p[0], p[1]);
      if (w) out.push({ key: key, lib: p[0], w: w });
    });
    return out;
  }

  /* ---------------- 详情弹窗 ---------------- */
  function openDetail(entry, lib, word) {
    state.detail = { entry: entry, lib: lib, word: word || (entry && entry.word) || '' };
  }
  function openMissing(raw) {
    state.detail = { entry: null, lib: READING_LIB, word: String(raw).replace(/^[^A-Za-z]+|[^A-Za-z]+$/g, ''), missing: true };
  }
  function closeDetail() { state.detail = null; }

  /* ---------------- 阅读页查词 ---------------- */
  function lookupInArticle(token) {
    const utils = global.WW.readingUtils;
    const entry = utils.lookupWord(global.WW.READING_DICT, token.text);
    const nk = utils.normalizeKey(token.text);
    if (state.lookedUp.indexOf(nk) < 0) state.lookedUp.push(nk);
    if (entry) openDetail(entry, READING_LIB, entry.word);
    else openMissing(token.text);
    return entry;
  }

  /* ---------------- 搜索（全词库精确 → 模糊 → 阅读词典） ---------------- */
  function search(q) {
    const query = String(q || '').trim().toLowerCase();
    if (!query) return false;
    const all = libs();
    for (const lib of Object.keys(all)) {
      let hit = all[lib].words.find((w) => w.word.toLowerCase() === query);
      if (!hit) hit = all[lib].words.find((w) => w.word.toLowerCase().indexOf(query) === 0);
      if (!hit) hit = all[lib].words.find((w) => w.word.toLowerCase().indexOf(query) > -1);
      if (hit) { openDetail(hit, lib, hit.word); return true; }
    }
    const rEntry = global.WW.readingUtils.lookupWord(global.WW.READING_DICT, query);
    if (rEntry) { openDetail(rEntry, READING_LIB, rEntry.word); return true; }
    toast('未找到「' + query + '」，换个单词试试');
    return false;
  }

  /* ---------------- 朗读 ---------------- */
  function speak(text, lang, el) {
    if (!('speechSynthesis' in window)) { toast('当前浏览器不支持语音朗读'); return; }
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; u.rate = 0.9;
    if (el) {
      el.classList.add('speaking');
      const stop = () => el.classList.remove('speaking');
      u.onend = stop; u.onerror = stop;
    }
    window.speechSynthesis.speak(u);
  }

  /* ---------------- 阅读内容 ---------------- */
  function setReadingArticle(article) {
    state.readingArticle = article || global.WW.ARTICLE;
    state.lookedUp.splice(0);
  }
  function setReadingLevel(level) {
    const n = parseInt(level, 10);
    state.readingLevel = isNaN(n) ? 3 : Math.max(0, Math.min(6, n));
  }
  function setReadingNews(items) {
    state.readingNewsItems = Array.isArray(items) ? items : [];
    state.readingSource = state.readingNewsItems.length ? 'live' : 'fallback';
  }

  /* ---------------- 轻提示 ---------------- */
  let toastTimer = null;
  function toast(text, ms) {
    state.toastText = text;
    state.toastShow = true;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { state.toastShow = false; }, ms || 1800);
  }

  /* ---------------- 登录 / 退出 ---------------- */
  function login(name, remember) {
    state.user = name;
    try {
      if (remember) localStorage.setItem(LS.user, name);
      else { localStorage.removeItem(LS.user); sessionStorage.setItem(LS.user, name); }
    } catch (e) {}
    go('app');
  }
  function logout() {
    try { localStorage.removeItem(LS.user); sessionStorage.removeItem(LS.user); } catch (e) {}
    state.user = '';
    go('login');
  }

  /* ---------------- 路由 ---------------- */
  function go(route) {
    global.WW.router.navigate(route);
  }

  /* ---------------- 初始化 ---------------- */
  function init() {
    state.unknown = readArray(LS.unknown);
    state.favorites = readArray(LS.fav);
    let theme = 'light';
    try { theme = localStorage.getItem(LS.theme) || 'light'; } catch (e) {}
    applyTheme(theme === 'dark');
    let remembered = '';
    try { remembered = localStorage.getItem(LS.user) || sessionStorage.getItem(LS.user) || ''; } catch (e) {}
    if (remembered) state.user = remembered;
  }

  global.WW = global.WW || {};
  global.WW.store = {
    state: state,
    READING_LIB: READING_LIB,
    keyOf: keyOf, libLabel: libLabel, libs: libs, words: words, current: current,
    setLib: setLib, go: go, jumpTo: jumpTo, toggleHide: toggleHide,
    findWord: findWord,
    isUnknown: isUnknown, addUnknown: addUnknown, removeUnknown: removeUnknown, clearUnknown: clearUnknown,
    isFav: isFav, toggleFav: toggleFav, removeFav: removeFav, clearFav: clearFav,
    collect: collect,
    openDetail: openDetail, openMissing: openMissing, closeDetail: closeDetail, lookupInArticle: lookupInArticle,
    setReadingArticle: setReadingArticle, setReadingLevel: setReadingLevel, setReadingNews: setReadingNews,
    search: search, speak: speak, toast: toast,
    applyTheme: applyTheme, toggleTheme: toggleTheme,
    login: login, logout: logout, init: init
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>

<script>

/* ============================================================
 * WordDetailModal · 单词详情弹窗

 *   关闭方式：右上角 ✕、点遮罩、Esc（Esc 在主 App 统一监听）
 * ============================================================ */
(function (global) {
  'use strict';
  const WW = global.WW = global.WW || {};
  WW.components = WW.components || {};
  const { computed } = global.Vue;

  WW.components.WordDetailModal = {
    name: 'WordDetailModal',
    components: {},
    setup() {
      const store = WW.store;
      const detail = computed(() => store.state.detail);
      const isPhrase = computed(() => !!(detail.value && detail.value.entry && detail.value.entry.type === 'phrase'));
      const faved = computed(() => {
        const d = detail.value;
        return !!(d && d.entry) && store.isFav(d.lib, d.word);
      });
      // 未收录时，顺便提示该词是否能在背单词词库中找到
      const libHit = computed(() => {
        const d = detail.value;
        if (!d || d.entry || !d.word) return null;
        const all = store.libs();
        for (const k of Object.keys(all)) {
          const hit = all[k].words.find((w) => w.word.toLowerCase() === String(d.word).toLowerCase());
          if (hit) return { lib: k, entry: hit };
        }
        return null;
      });

      function close() { store.closeDetail(); }
      function speakIt(lang) {
        const d = store.state.detail;
        if (d) store.speak(d.word, lang, null);
      }
      function toggleFav() {
        const d = store.state.detail;
        if (!d || !d.entry) return;
        const on = store.toggleFav(d.lib, d.word);
        store.toast(on ? '已加入「收藏」' : '已取消收藏');
      }
      function jumpToLibrary() {
        const hit = libHit.value;
        if (!hit) return;
        store.setLib(hit.lib);
        store.closeDetail();
        if (store.state.route !== 'app') WW.router.navigate('app');
        store.toast('已切换到 ' + store.libLabel(hit.lib) + ' 词库');
      }

      return { store, detail, isPhrase, faved, libHit, close, speakIt, toggleFav, jumpToLibrary };
    },
    template: `

  <div v-if="detail" class="fixed inset-0 z-[140] flex items-center justify-center p-4
                            bg-[rgba(60,48,32,.42)] dark:bg-black/60 backdrop-blur-[5px]"
       @click.self="close">
    <transition name="ww-pop" appear>
      <div class="relative w-full max-w-[640px] max-h-[90vh] overflow-y-auto ww-scroll
                  rounded-[22px] ww-card ww-solid px-6 sm:px-9 pt-8 pb-7">

                   text-ink dark:text-slate-50">{{ detail.word }}</h2>
        <p class="text-center text-[12px] tracking-[2px] text-ink-400 dark:text-slate-400 mt-1 mb-3">

        <!-- 音标 + 发音 -->
        <div class="flex flex-wrap justify-center gap-3 mb-2">
          <template v-if="detail.entry && (detail.entry.us || detail.entry.uk)">
            <button v-if="detail.entry.us" @click="speakIt('en-US')"
                    class="phon-btn flex items-center gap-1.5 px-4 py-2 rounded-full text-[14px] font-semibold text-white
                           bg-gradient-to-br from-[#ff8fb1] to-brand-pink shadow-lg shadow-brand-pink/30 transition
                           hover:-translate-y-0.5 active:scale-95">
              🇺🇸 🔊 <span>{{ detail.entry.us }}</span>
            </button>
            <button v-if="detail.entry.uk" @click="speakIt('en-GB')"
                    class="phon-btn flex items-center gap-1.5 px-4 py-2 rounded-full text-[14px] font-semibold text-white
                           bg-gradient-to-br from-[#ff8fb1] to-brand-pink shadow-lg shadow-brand-pink/30 transition
                           hover:-translate-y-0.5 active:scale-95">
              🇬🇧 🔊 <span>{{ detail.entry.uk }}</span>
            </button>
          </template>
          <button v-else @click="speakIt('en-US')"
                  class="flex items-center gap-1.5 px-4 py-2 rounded-full text-[14px] font-semibold text-white
                         bg-gradient-to-br from-brand-violet to-brand-blue shadow-lg shadow-brand-violet/30 transition
                         hover:-translate-y-0.5">
            🔊 <span>朗读</span>
          </button>
        </div>

        <!-- 已收录：完整释义 -->
        <MeaningBlock v-if="detail.entry" :entry="detail.entry" />

        <!-- 未收录兜底 -->
        <div v-else class="mt-5 rounded-2xl px-5 py-6 text-center
                           bg-gradient-to-r from-[#e9f3fd] to-[#fdeaf2]
                           dark:from-[#26313f] dark:to-[#342732]">
          <p class="text-[15px] font-bold text-ink-700 dark:text-slate-100">这个词还没有收录进演示词典 📭</p>
          <p class="mt-1.5 text-[13px] text-ink-500 dark:text-slate-300">
            演示词典收录了本文的 30 个重点词与 6 个词组，其余单词点击后会走到这个兜底状态。
          </p>
          <button v-if="libHit" @click="jumpToLibrary"
                  class="mt-4 px-4 py-2 rounded-xl text-sm font-bold text-white
                         bg-gradient-to-br from-brand-blue2 to-brand-blue shadow-md transition hover:-translate-y-0.5">
            在「{{ store.libLabel(libHit.lib) }}」词库中找到它 →
          </button>
        </div>

        <div class="flex gap-2.5 mt-6">
          <button v-if="detail.entry" @click="toggleFav"
                  :class="faved
                    ? 'text-white bg-gradient-to-br from-[#ffd76e] to-[#f0a93b] border-transparent'
                    : 'text-[#c08a2e] bg-cream-100 dark:bg-slate-800 border-[#f0d9a8] dark:border-slate-600'"
                  class="flex-1 py-3 rounded-xl font-bold text-sm border transition hover:-translate-y-0.5">
            {{ faved ? '★ 已收藏' : '☆ 收藏' }}
          </button>
          <button @click="close"
                  class="flex-1 py-3 rounded-xl font-bold text-sm text-white
                         bg-gradient-to-br from-brand-blue2 to-brand-blue shadow-md transition hover:-translate-y-0.5">关闭</button>
        </div>
      </div>
    </transition>
  </div>
</transition>
`
  };
})(window);

</script>

 *   悬浮变色 + 下划线提示可点击，点击后向上抛出 lookup 事件
 * ============================================================ */

  'use strict';
  const WW = global.WW = global.WW || {};
  WW.components = WW.components || {};

  WW.components.ArticleText = {
    name: 'ArticleText',
    props: {
      tokens: { type: Array, required: true },   // [[token, ...], ...] 每段一个数组
      seen: { type: Array, default: () => [] },  // 已查过的词
      fontSize: { type: String, default: 'md' }
    },
    emits: ['lookup'],
    setup() { return { store: WW.store }; },
    template: `
<div class="article-body" :class="{ 'font-sm': fontSize === 'sm', 'font-lg': fontSize === 'lg' }">
  <p v-for="(para, pi) in tokens" :key="'p' + pi" class="article-para">
    <template v-for="(t, ti) in para" :key="pi + '-' + ti">
      <span v-if="t.type === 'word'"
            class="rd-word"
            :class="{ 'is-seen': seen.indexOf(t.key) > -1 }"
            role="button" tabindex="0"
            :title="'点击查看 ' + t.text + ' 的释义'"
            @click="$emit('lookup', t)"
            @keydown.enter.prevent="$emit('lookup', t)"
            @keydown.space.prevent="$emit('lookup', t)">{{ t.text }}</span>
      <span v-else-if="t.type === 'phrase'"
            class="rd-phrase"
            role="button" tabindex="0"
            :title="'点击查看词组 ' + t.text + ' 的释义'"
            @click="$emit('lookup', t)"
            @keydown.enter.prevent="$emit('lookup', t)"
            @keydown.space.prevent="$emit('lookup', t)">{{ t.text }}</span>
      <template v-else>{{ t.text }}</template>
    </template>
  </p>
</div>
`
  };
})(window);

</script>
<script>
/* ==== js/components/ReadingView.js ==== */
/* ============================================================
 * ReadingView · 英语新闻阅读页
 *   实时加载 Breaking News English，支持 Level 0-6、随机换稿
 *   点击任意单词 / 词组 → 弹出与主页一致的单词详情弹窗
 * ============================================================ */
(function (global) {
  'use strict';
  const WW = global.WW = global.WW || {};
  WW.components = WW.components || {};
  const { computed, ref, onMounted } = global.Vue;

  WW.components.ReadingView = {
    name: 'ReadingView',
    setup() {
      const store = WW.store;
      const utils = WW.readingUtils;
      const source = WW.breakingNews;
      const loading = ref(false);
      const liveError = ref('');

      const article = computed(() => store.state.readingArticle || WW.ARTICLE);
      const tokens = computed(() => utils.tokenizeArticle(article.value.paragraphs || [], WW.READING_PHRASES));
      const wordCount = computed(() => article.value.words || utils.countWords(article.value.paragraphs || []));
      const dictSize = Object.keys(WW.READING_DICT).filter((k) => !WW.READING_DICT[k].type).length;
      const phraseSize = Object.keys(WW.READING_DICT).filter((k) => WW.READING_DICT[k].type === 'phrase').length;
      const progress = computed(() => {
        const seen = store.state.lookedUp;
        const all = new Set();
        tokens.value.forEach((p) => p.forEach((t) => { if (t.type === 'word' || t.type === 'phrase') all.add(t.key); }));
        const hit = [...all].filter((k) => seen.indexOf(k) > -1).length;
        return { hit: hit, total: all.size };
      });

      const font = computed(() => store.state.readingFont);
      const levels = [0, 1, 2, 3, 4, 5, 6];
      const currentItem = computed(() => {
        const items = store.state.readingNewsItems || [];
        return items.find((item) => {
          if (item.id === article.value.id || item.url === article.value.sourceUrl) return true;
          const urls = Object.keys(item.availableLevels || {}).map((key) => item.availableLevels[key]);
          return urls.indexOf(article.value.sourceUrl) > -1;
        }) || null;
      });
      const liveReady = computed(() => store.state.readingSource === 'live' && store.state.readingNewsItems.length > 0);
      const liveArticleReady = computed(() => liveReady.value && !!article.value.sourceUrl);
      const currentArticleKey = computed(() => article.value.sourceUrl || article.value.id);
      const selectedBand = computed(() => source.LEVEL_BANDS[store.state.readingLevel] || '');

      function setFont(v) {
        store.state.readingFont = v;
        store.toast('正文字号：' + (v === 'sm' ? '小' : v === 'lg' ? '大' : '中'), 1200);
      }
      function onLookup(token) { store.lookupInArticle(token); }
      function resetLooked() { store.state.lookedUp.splice(0); }
      function goHome() { WW.router.navigate('app'); }
      function errorText(error) { return (error && error.message) || '实时新闻加载失败'; }

      async function loadArticle(item, requestedLevel, force) {
        if (!item || loading.value) return;
        loading.value = true;
        liveError.value = '';
        try {
          const next = await source.getArticle(item, requestedLevel, force);
          store.setReadingArticle(next);
          if (next.fallback) {
            store.toast('Level ' + requestedLevel + ' 暂无版本，已自动使用相邻的 Level ' + next.resolvedLevel, 2600);
          }
        } catch (error) {
          liveError.value = errorText(error);
          store.toast('文章加载失败：' + liveError.value, 3200);
        } finally {
          loading.value = false;
        }
      }

      async function loadLatest(force) {
        if (loading.value) return;
        loading.value = true;
        liveError.value = '';
        try {
          const items = await source.getLatestNews(force);
          store.setReadingNews(items);
          const item = source.pickRandomItem(items, store.state.readingLevel, currentArticleKey.value);
          if (!item) throw new Error('没有符合当前难度的新闻');
          const next = await source.getArticle(item, store.state.readingLevel, force);
          store.setReadingArticle(next);
          if (next.fallback) store.toast('已自动使用相邻的 Level ' + next.resolvedLevel, 2200);
        } catch (error) {
          liveError.value = errorText(error);
          store.state.readingSource = 'fallback';
        } finally {
          loading.value = false;
        }
      }

      async function setLevel(level) {
        if (loading.value || store.state.readingLevel === level) return;
        store.setReadingLevel(level);
        store.toast('已选择 Level ' + level, 1200);
        const item = currentItem.value;
        if (item) await loadArticle(item, level, false);
        else await loadLatest(true);
      }

      async function randomArticle() {
        if (loading.value) return;
        const items = store.state.readingNewsItems || [];
        if (!items.length) { await loadLatest(true); return; }
        const item = source.pickRandomItem(items, store.state.readingLevel, currentArticleKey.value);
        if (!item) { store.toast('文章库中没有其他可用新闻', 1800); return; }
        await loadArticle(item, store.state.readingLevel, false);
      }

      onMounted(() => { loadLatest(false); });

      return {
        store, source, article, tokens, wordCount, dictSize, phraseSize, progress, font, levels,
        currentItem, liveReady, liveArticleReady, selectedBand, loading, liveError,
        setFont, onLookup, resetLooked, goHome, loadLatest, setLevel, randomArticle
      };
    },
    template: `
<div class="min-h-screen flex flex-col pb-10">
  <AppTopBar />

  <main class="flex-1 w-full max-w-[860px] mx-auto px-4 md:px-6 py-6 md:py-9">
    <div class="flex items-center justify-between gap-3 mb-4">
      <button @click="goHome"
              class="flex items-center gap-2 px-3.5 py-2 rounded-xl text-sm font-bold
                     text-ink-600 dark:text-slate-300 bg-white/80 dark:bg-slate-800/80
                     border border-cream-300 dark:border-slate-700 shadow-sm transition
                     hover:-translate-x-0.5 hover:text-brand-bluedeep hover:border-brand-blue2">
        ⬅️ 返回单词主页
      </button>
      <div class="flex items-center gap-2">
        <span class="hidden sm:inline text-[12px] font-bold text-ink-400 dark:text-slate-400 mr-1">字号</span>
        <button v-for="f in ['sm','md','lg']" :key="f" @click="setFont(f)"
                :class="font === f ? 'text-white bg-gradient-to-br from-brand-blue2 to-brand-blue border-transparent'
                                   : 'text-ink-500 dark:text-slate-300 bg-white dark:bg-slate-800 border-cream-300 dark:border-slate-700'"
                class="w-9 h-9 rounded-lg border text-[12px] font-extrabold leading-none whitespace-nowrap transition">
          {{ f === 'sm' ? 'A-' : f === 'md' ? 'A' : 'A+' }}
        </button>
      </div>
    </div>

    <section class="ww-card rounded-[22px] px-4 sm:px-6 py-4 mb-4">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div>
          <p class="text-[12px] font-bold tracking-wide text-ink-400 dark:text-slate-400">阅读难度</p>
          <p class="mt-0.5 text-[18px] font-extrabold text-ink dark:text-slate-50">
            Level {{ store.state.readingLevel }}
            <span class="ml-1 text-[12px] font-bold text-brand-bluedeep dark:text-[#9cc4ff]">{{ selectedBand }}</span>
          </p>
        </div>
        <button @click="randomArticle" :disabled="loading"
                class="flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl text-[13px] font-extrabold
                       text-white bg-gradient-to-br from-brand-violet to-brand-blue shadow-lg shadow-brand-blue/25
                       transition hover:-translate-y-0.5 disabled:opacity-55 disabled:cursor-not-allowed">
          <span v-if="loading" class="w-4 h-4 rounded-full border-2 border-white/40 border-t-white animate-spin"></span>
          {{ loading ? '正在加载...' : '🎲 随机换一篇' }}
        </button>
      </div>

      <div class="grid grid-cols-7 gap-1.5 sm:gap-2 mt-3">
        <button v-for="n in levels" :key="n" @click="setLevel(n)" :disabled="loading"
                :class="store.state.readingLevel === n
                  ? 'text-white bg-gradient-to-br from-brand-blue2 to-brand-blue border-transparent shadow-md shadow-brand-blue/25'
                  : 'text-ink-500 dark:text-slate-300 bg-cream-50 dark:bg-slate-800 border-cream-300 dark:border-slate-700 hover:border-brand-blue2'"
                class="h-9 rounded-lg border text-[12px] font-extrabold transition disabled:opacity-55 disabled:cursor-not-allowed">
          L{{ n }}
        </button>
      </div>

      <div class="flex flex-wrap items-center gap-x-3 gap-y-1 mt-3 text-[12px] font-semibold text-ink-400 dark:text-slate-400">
        <span :class="liveArticleReady ? 'text-emerald-600 dark:text-emerald-400' : 'text-amber-600 dark:text-amber-400'">
          {{ liveArticleReady ? '● 实时新闻已连接' : (liveReady ? '● 正在加载实时文章...' : '● 当前使用内置示例') }}
        </span>
        <span v-if="currentItem">更新：{{ currentItem.date }} · {{ currentItem.kind }} 版</span>
        <span v-if="article.fallback" class="text-amber-600 dark:text-amber-400">
          当前文章没有 Level {{ store.state.readingLevel }}，已回退到 Level {{ article.resolvedLevel }}
        </span>
      </div>

      <div v-if="liveError" class="mt-3 flex flex-wrap items-center gap-2 rounded-xl px-3 py-2
                                    bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800
                                    text-[12px] leading-5 text-amber-700 dark:text-amber-300">
        <span class="flex-1">实时新闻暂不可用：{{ liveError }}</span>
        <button @click="loadLatest(true)" :disabled="loading" class="font-extrabold underline underline-offset-2">重试</button>
      </div>
    </section>

    <article class="ww-card rounded-[26px] px-5 sm:px-10 md:px-12 py-8 md:py-10 transition"
             :class="{ 'opacity-55': loading }">
      <div class="flex flex-wrap items-center gap-2 mb-4">
        <span class="px-3 py-1 rounded-full text-[12px] font-extrabold text-brand-bluedeep bg-brand-blue/12 dark:bg-brand-blue/20 dark:text-[#9cc4ff]">{{ article.tag }}</span>
        <span class="px-3 py-1 rounded-full text-[12px] font-bold text-ink-500 dark:text-slate-300 bg-cream-200 dark:bg-slate-800">{{ article.level }}</span>
        <span v-if="article.published" class="px-3 py-1 rounded-full text-[12px] font-bold text-ink-500 dark:text-slate-300 bg-cream-200 dark:bg-slate-800">{{ article.published }}</span>
      </div>

      <h1 class="text-[26px] sm:text-[34px] font-extrabold leading-tight text-ink dark:text-slate-50">{{ article.title }}</h1>
      <p v-if="article.titleZh" class="mt-1.5 text-[14px] text-ink-500 dark:text-slate-400">{{ article.titleZh }}</p>

      <div class="flex flex-wrap items-center gap-x-4 gap-y-1 mt-4 pb-5 mb-6
                  text-[12.5px] font-semibold text-ink-400 dark:text-slate-400
                  border-b border-cream-300/80 dark:border-slate-700">
        <span>📄 约 {{ wordCount }} 词</span>

      </div>

      <div class="mt-8 pt-5 border-t border-cream-300/80 dark:border-slate-700 flex flex-wrap items-center gap-3

        <button @click="resetLooked"

    <p class="text-center text-[12px] text-ink-400 dark:text-slate-500 mt-6">
      Word Wind · 实时新闻阅读 · 来源 Breaking News English · 点击查词
    </p>
  </main>
</div>
`
  };
})(window);

/* ==== js/components/RegisterModal.js ==== */
/* ============================================================
 * RegisterModal · 注册弹窗（演示：前端校验 + 模拟提交，不落库）
 * ============================================================ */
(function (global) {
  'use strict';
  const WW = global.WW = global.WW || {};
  WW.components = WW.components || {};
  const { ref } = global.Vue;

  WW.components.RegisterModal = {
    name: 'RegisterModal',
    props: { show: { type: Boolean, default: false } },
    emits: ['close', 'registered'],
    setup(props, ctx) {
      const store = WW.store;
      const user = ref('');
      const pwd = ref('');
      const confirm = ref('');
      const showPwd = ref(false);
      const errors = ref({ user: '', pwd: '', confirm: '' });
      const loading = ref(false);
      const done = ref(false);

      function validate(notify) {
        const e = { user: '', pwd: '', confirm: '' };
        if (!user.value.trim()) e.user = '请输入用户名';
        else if (user.value.trim().length < 2) e.user = '用户名至少 2 个字符';
        if (!pwd.value) e.pwd = '请输入密码';
        else if (pwd.value.length < 6) e.pwd = '密码至少 6 位';
        if (!confirm.value) e.confirm = '请再次输入密码';
        else if (confirm.value !== pwd.value) e.confirm = '两次密码不一致';
        errors.value = e;
        const first = e.user || e.pwd || e.confirm;
        if (first && notify) store.toast('⚠️ ' + first, 2400);
        return !first;
      }

      async function submit() {
        if (!validate(true)) return;
        loading.value = true;
        await new Promise((r) => setTimeout(r, 900));
        loading.value = false;
        done.value = true;
        const name = user.value.trim();
        setTimeout(() => {
          ctx.emit('registered', name);
          reset();
        }, 700);
      }
      function reset() {
        user.value = ''; pwd.value = ''; confirm.value = '';
        errors.value = { user: '', pwd: '', confirm: '' };
        done.value = false; showPwd.value = false;
      }
      function close() { reset(); ctx.emit('close'); }

      return { store, user, pwd, confirm, showPwd, errors, loading, done, submit, close };
    },
    template: `

  <div v-if="show" class="fixed inset-0 z-[150] flex items-center justify-center p-5
                          bg-[rgba(60,48,32,.42)] dark:bg-black/60 backdrop-blur-[5px]"

      <div class="relative w-full max-w-[430px] max-h-[90vh] overflow-y-auto ww-scroll

        <h2 class="text-center text-[22px] font-extrabold text-ink dark:text-slate-50">创建账号</h2>

        <form @submit.prevent="submit" novalidate>
          <div class="mb-4">
            <label class="block text-[13px] font-semibold text-ink-600 dark:text-slate-300 mb-1.5">用户名</label>
            <div :class="errors.user ? 'border-red-400 ring-4 ring-red-400/15' : 'border-cream-300 dark:border-slate-700 focus-within:border-brand-blue focus-within:ring-4 focus-within:ring-brand-blue/15'"
                 class="flex items-center gap-2 px-3 rounded-xl bg-cream-50 dark:bg-slate-800 border transition">
              <span class="text-[15px] opacity-80">👤</span>
              <input v-model="user" type="text" placeholder="2 位以上字符" autocomplete="off"
                     class="flex-1 bg-transparent border-none outline-none py-3 text-[15px] text-ink dark:text-slate-100" />
            </div>
            <p class="text-[13px] font-semibold text-red-500 mt-1.5 min-h-[18px]">{{ errors.user ? '⚠️ ' + errors.user : '' }}</p>
          </div>

          <div class="mb-4">
            <label class="block text-[13px] font-semibold text-ink-600 dark:text-slate-300 mb-1.5">密码</label>
            <div :class="errors.pwd ? 'border-red-400 ring-4 ring-red-400/15' : 'border-cream-300 dark:border-slate-700 focus-within:border-brand-blue focus-within:ring-4 focus-within:ring-brand-blue/15'"
                 class="flex items-center gap-2 px-3 rounded-xl bg-cream-50 dark:bg-slate-800 border transition">
              <span class="text-[15px] opacity-80">🔒</span>
              <input v-model="pwd" :type="showPwd ? 'text' : 'password'" placeholder="至少 6 位" autocomplete="new-password"
                     class="flex-1 bg-transparent border-none outline-none py-3 text-[15px] text-ink dark:text-slate-100" />
              <button type="button" @click="showPwd = !showPwd" class="text-[15px] opacity-70 hover:opacity-100">{{ showPwd ? '🙈' : '👁️' }}</button>
            </div>
            <p class="text-[13px] font-semibold text-red-500 mt-1.5 min-h-[18px]">{{ errors.pwd ? '⚠️ ' + errors.pwd : '' }}</p>
          </div>

          <div class="mb-4">
            <label class="block text-[13px] font-semibold text-ink-600 dark:text-slate-300 mb-1.5">确认密码</label>
            <div :class="errors.confirm ? 'border-red-400 ring-4 ring-red-400/15' : 'border-cream-300 dark:border-slate-700 focus-within:border-brand-blue focus-within:ring-4 focus-within:ring-brand-blue/15'"
                 class="flex items-center gap-2 px-3 rounded-xl bg-cream-50 dark:bg-slate-800 border transition">
              <span class="text-[15px] opacity-80">🔐</span>
              <input v-model="confirm" type="password" placeholder="再次输入密码" autocomplete="new-password"
                     class="flex-1 bg-transparent border-none outline-none py-3 text-[15px] text-ink dark:text-slate-100" />
            </div>
            <p class="text-[13px] font-semibold text-red-500 mt-1.5 min-h-[18px]">{{ errors.confirm ? '⚠️ ' + errors.confirm : '' }}</p>
          </div>

          <button type="submit" :disabled="loading"
                  class="w-full py-3.5 rounded-xl text-[15px] font-bold tracking-[3px] text-white
                         bg-gradient-to-br from-brand-blue2 to-brand-blue shadow-lg shadow-brand-blue/30
                         flex items-center justify-center gap-2 transition
                         hover:-translate-y-0.5 disabled:opacity-60 disabled:cursor-not-allowed">
            <span v-if="loading" class="w-4 h-4 rounded-full border-2 border-white/40 border-t-white animate-spin"></span>
            {{ loading ? '注册中...' : '注 册' }}
          </button>
          <p v-if="done" class="text-center text-[13px] font-semibold text-emerald-600 dark:text-emerald-400 mt-3">✅ 注册成功，快去登录吧！</p>
        </form>
      </div>
    </transition>
  </div>
</transition>
`
  };
})(window);

<script>
/* ==== js/components/LoginView.js ==== */
/* ============================================================
 * LoginView · 登录页（仅保留登录栏）
 * 说明：演示页面，用户名 ≥2、密码 ≥6 即可登录，不校验真实账号
 * ============================================================ */
(function (global) {
  'use strict';
  const WW = global.WW = global.WW || {};
  WW.components = WW.components || {};
  const { ref } = global.Vue;

  WW.components.LoginView = {
    name: 'LoginView',
    setup() {
      const store = WW.store;
      const user = ref('');
      const pwd = ref('');
      const showPwd = ref(false);
      const remember = ref(false);
      const loading = ref(false);
      const errors = ref({ user: '', pwd: '' });
      const shakeUser = ref(false);
      const shakePwd = ref(false);

      function shake(which) {
        const r = which === 'user' ? shakeUser : shakePwd;
        r.value = false;
        requestAnimationFrame(() => {
          r.value = true;
          setTimeout(() => { r.value = false; }, 600);
        });
      }

      /* 浏览器自动填充（autofill）有时不会触发 input 事件，
         会让 v-model 停在旧值，提交前从 DOM 同步一次，避免"明明填了却说没填" */
      function syncFromDom() {
        const u = document.getElementById('username');
        const p = document.getElementById('password');
        if (u && u.value !== user.value) user.value = u.value;
        if (p && p.value !== pwd.value) pwd.value = p.value;
      }

      /* 校验：notify=true 时用弹窗提示把错误"喊出来"，避免看起来像点击没反应 */
      function validate(notify) {
        if (notify) syncFromDom();
        const e = { user: '', pwd: '' };
        const u = user.value.trim();
        if (!u) e.user = '请输入用户名';
        else if (u.length < 2) e.user = '用户名至少 2 个字符';
        if (!pwd.value) e.pwd = '请输入密码';
        else if (pwd.value.length < 6) e.pwd = '密码至少 6 位';
        errors.value = e;
        const first = e.user || e.pwd;
        if (first) {
          shake(e.user ? 'user' : 'pwd');
          if (notify) store.toast('⚠️ ' + first, 2400);
        }
        return !first;
      }

      async function submit() {
        syncFromDom();
        if (!validate(true)) return;
        loading.value = true;
        await new Promise((r) => setTimeout(r, 900));   // 模拟请求
        loading.value = false;
        store.login(user.value.trim(), remember.value);
        store.toast('登录成功，欢迎回来！', 1500);
      }

      function forgot() {
        store.toast('演示页面：请输入任意用户名（≥2 位）和密码（≥6 位）直接登录', 2600);
      }

      return { store, user, pwd, showPwd, remember, loading, errors, shakeUser, shakePwd, submit, forgot, validate };
    },
    template: `
<div class="min-h-screen grid place-items-center px-5 py-10">
  <section class="w-full max-w-[430px] rounded-[24px] px-6 sm:px-10 pt-10 pb-8 ww-card">
    <h1 class="text-center text-[26px] font-extrabold text-[#2f3b4a] dark:text-slate-50 mb-7">登录</h1>

    <form @submit.prevent="submit" novalidate>
      <div class="mb-4">
        <label for="username" class="block text-[13px] font-semibold text-ink-600 dark:text-slate-300 mb-1.5">用户名</label>
        <div :class="[errors.user ? 'border-red-400 ring-4 ring-red-400/15' : 'border-cream-300 dark:border-slate-700 focus-within:border-brand-blue focus-within:ring-4 focus-within:ring-brand-blue/15', shakeUser ? 'ww-shake' : '']"
             class="flex items-center gap-2 px-3 rounded-xl bg-cream-50 dark:bg-slate-800 border transition">
          <span class="text-[15px] opacity-80">👤</span>
          <input id="username" v-model="user" type="text" placeholder="请输入用户名（2 位以上）" autocomplete="username"
                 @blur="validate(false)"
                 class="flex-1 bg-transparent border-none outline-none py-3 text-[15px] text-ink dark:text-slate-100 placeholder:text-ink-400 dark:placeholder:text-slate-500" />
        </div>
        <p class="text-[13px] font-semibold text-red-500 mt-1.5 min-h-[18px]">{{ errors.user ? '⚠️ ' + errors.user : '' }}</p>
      </div>

      <div class="mb-2">
        <label for="password" class="block text-[13px] font-semibold text-ink-600 dark:text-slate-300 mb-1.5">密码</label>
        <div :class="[errors.pwd ? 'border-red-400 ring-4 ring-red-400/15' : 'border-cream-300 dark:border-slate-700 focus-within:border-brand-blue focus-within:ring-4 focus-within:ring-brand-blue/15', shakePwd ? 'ww-shake' : '']"
             class="flex items-center gap-2 px-3 rounded-xl bg-cream-50 dark:bg-slate-800 border transition">
          <span class="text-[15px] opacity-80">🔒</span>
          <input id="password" v-model="pwd" :type="showPwd ? 'text' : 'password'" placeholder="请输入密码（6 位以上）" autocomplete="current-password"
                 @blur="validate(false)"
                 class="flex-1 bg-transparent border-none outline-none py-3 text-[15px] text-ink dark:text-slate-100 placeholder:text-ink-400 dark:placeholder:text-slate-500" />
          <button type="button" @click="showPwd = !showPwd" class="text-[15px] opacity-70 hover:opacity-100">{{ showPwd ? '🙈' : '👁️' }}</button>
        </div>
        <p class="text-[13px] font-semibold text-red-500 mt-1.5 min-h-[18px]">{{ errors.pwd ? '⚠️ ' + errors.pwd : '' }}</p>
      </div>

      <div class="flex items-center justify-between my-5 text-[13px]">
        <label class="flex items-center gap-2 cursor-pointer text-ink-600 dark:text-slate-300">
          <input v-model="remember" type="checkbox" class="w-4 h-4 accent-brand-blue cursor-pointer" />
          <span>记住我</span>

        <button type="button" @click="forgot" class="font-semibold text-brand-bluedeep hover:underline">忘记密码？</button>
      </div>

      <button id="loginBtn" type="submit" :disabled="loading"
              class="w-full py-3.5 rounded-xl text-[15px] font-bold tracking-[3px] text-white
                     bg-gradient-to-br from-brand-blue2 to-brand-blue shadow-lg shadow-brand-blue/30
                     flex items-center justify-center gap-2 transition
                     hover:-translate-y-0.5 disabled:opacity-50 disabled:cursor-not-allowed">
        <span v-if="loading" class="w-4 h-4 rounded-full border-2 border-white/40 border-t-white animate-spin"></span>
        {{ loading ? '登录中...' : '登 录' }}
      </button>
    </form>
  </section>
</div>
`
  };
})(window);
</script>

<!-- ===================== 启动 ===================== -->
<script>
/* ==== js/app.js ==== */
/* ============================================================
 * app.js · 应用入口
 *   注册全部组件 → 挂载根组件 → 启动 hash 路由 → 绑定全局快捷键
 * ============================================================ */
(function (global) {
  'use strict';
  const WW = global.WW = global.WW || {};
  const Vue = global.Vue;
  const { computed, onMounted, onBeforeUnmount } = Vue;

  const RootApp = {
    name: 'RootApp',
    setup() {
      const store = WW.store;
      const route = computed(() => store.state.route);

      function onKeydown(e) {
        if (e.key === 'Escape') { store.closeDetail(); return; }
        if (store.state.route !== 'app') return;
        const tag = (e.target && e.target.tagName) || '';
        if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
        if (e.key === 'ArrowLeft') store.go(-1);
        if (e.key === 'ArrowRight') store.go(1);
      }

      /* 兜底：任何未捕获的脚本错误都用提示条喊出来，
         避免在预览沙箱里表现为「点了没反应」却毫无线索 */
      function onError(e) {
        const msg = (e && (e.message || e.reason && e.reason.message)) || '未知脚本错误';
        if (WW.store) WW.store.toast('⚠️ 脚本错误：' + msg, 6000);
      }

      onMounted(() => {
        store.init();
        WW.router.start((r) => {
          // 未登录：除登录页外一律回到登录页
          if (!store.state.user && r !== 'login') { store.state.route = 'login'; WW.router.navigate('login'); return; }
          // 已登录（记住我）：直接进入主页
          if (store.state.user && r === 'login') { store.state.route = 'app'; WW.router.navigate('app'); return; }
          store.state.route = r;
        });
        global.addEventListener('keydown', onKeydown);
        global.addEventListener('error', onError);
        global.addEventListener('unhandledrejection', onError);
      });

      onBeforeUnmount(() => {
        global.removeEventListener('keydown', onKeydown);
        global.removeEventListener('error', onError);
        global.removeEventListener('unhandledrejection', onError);
      });

      return { store, route };
    },
    template: `
<div>
  <LoginView v-if="route === 'login'" />
  <StudyView v-else-if="route === 'app'" />
  <ReadingView v-else-if="route === 'reading'" />
  <WordDetailModal />
  <ToastHost />
</div>
`
  };

  function boot() {
    const app = Vue.createApp(RootApp);
    Object.keys(WW.components).forEach((name) => app.component(name, WW.components[name]));
    app.mount('#app');
    WW.app = app;
  }

  WW.boot = boot;
})(window);

</script>
<script>
  (function () {
    if (!window.Vue) {
      document.getElementById('bootError').classList.remove('hidden');
      document.getElementById('app').innerHTML = '';
      return;
    }
    window.WW.boot();
  })();
</script>
</body>
</html>
